name: Bug report
description: Report a reproducible problem in JetSearch.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please check existing issues before submitting. Include enough detail to reproduce the problem.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue clearly.
      placeholder: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch JetSearch
        2. Search for ...
        3. Change ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: JetSearch version or commit
      placeholder: v0.1.0 / commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal information and sensitive paths before posting.
