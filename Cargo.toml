[package]
name = "jetsearch"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# software renderer = no GPU/OpenGL context, much lower RAM than the default femtovg renderer
slint = { optional = true, version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "accessibility"] }

[build-dependencies]
slint-build = { version = "1", optional = true }

[[bin]]
name = "jetsearch"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:slint", "dep:slint-build"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
